<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<script>
var App = {
  currentUser: null,
  liffId: '<?= liffId ?>' || '2009016720-NiJ6Jzhp',
  screenTag: '<?= screenTag ?>' || 'SA03',
  gasUrl: 'https://script.google.com/macros/s/AKfycbzT-c6Lv1Zjaw4vKkOEHj7vjxN8TC86SLBX2zGPD-QKvg1UC2CcO_HlTTOyUIRa2fK1xg/exec',

  /**
   * เริ่มต้นระบบ LIFF และดึงข้อมูลผู้ใช้งาน
   */
  init: function(onReady) {
    var self = this;
    self.showLoading('กำลังเชื่อมต่อระบบ LINE...');

    // กรณีรันบน GitHub Pages ค่า <?= liffId ?> จะไม่ถูก parse ให้ใช้ fallback
    if (!self.liffId || self.liffId.indexOf('<?=') !== -1) {
      self.liffId = '2009016720-NiJ6Jzhp';
    }

    if (!self.liffId) {
      console.warn('[App] LIFF ID is not configured. Switching to Test Mode.');
      self.initMockMode_(onReady);
      return;
    }

    liff.init({ liffId: self.liffId })
      .then(function() {
        if (!liff.isLoggedIn() && liff.isInClient()) {
          liff.login();
          return;
        }

        if (liff.isLoggedIn()) {
          liff.getProfile().then(function(profile) {
            self.verifyUserOnServer_(profile.userId, profile.displayName, onReady);
          }).catch(function(err) {
            console.error('[App] Failed to get LINE profile:', err);
            self.initMockMode_(onReady);
          });
        } else {
          // รันบน Browser ทั่วไป นอก LINE (เช่น Desktop Test หรือ GitHub Pages)
          self.initMockMode_(onReady);
        }
      })
      .catch(function(err) {
        console.error('[App] LIFF init error:', err);
        self.initMockMode_(onReady);
      });
  },

  /**
   * ยืนยันตัวตนกับ Central IAM Service
   */
  verifyUserOnServer_: function(lineUid, displayName, callback) {
    var self = this;
    self.showLoading('กำลังตรวจสอบสิทธิ์การใช้งาน...');

    self.callServer('apiVerifyUser', lineUid)
      .then(function(res) {
        self.hideLoading();
        if (res && res.success && res.data) {
          self.currentUser = res.data;
          self.renderUserProfileHeader_();
          if (callback) callback(self.currentUser);
        } else {
          var msg = (res && res.error) ? res.error.message : 'ท่านไม่มีสิทธิ์เข้าใช้งานระบบนี้';
          self.showAccessDeniedScreen(msg);
        }
      })
      .catch(function(err) {
        self.hideLoading();
        self.showAccessDeniedScreen('เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์: ' + err.message);
      });
  },

  /**
   * โหมดจำลองผู้ใช้เมื่อเปิดเทสบน Web Browser ทั่วไป
   */
  initMockMode_: function(callback) {
    var self = this;
    var savedUid = localStorage.getItem('fm_sa03_mock_uid') || 'MOCK_DEV_USER';
    
    var mockPrompt = prompt(
      '⚠️ คุณกำลังเปิดบน Browser ทั่วไป (นอก LINE)\n' +
      'กรุณาระบุ LINE UID หรือใช้ค่าจำลองด้านล่างเพื่อทดสอบ:',
      savedUid
    );

    var targetUid = mockPrompt ? mockPrompt.trim() : savedUid;
    localStorage.setItem('fm_sa03_mock_uid', targetUid);

    self.verifyUserOnServer_(targetUid, 'ผู้ทดสอบ (Test Mode)', callback);
  },

  renderUserProfileHeader_: function() {
    var u = this.currentUser;
    if (!u) return;
    var nameEl = document.getElementById('headerUserName');
    var avatarEl = document.getElementById('headerUserAvatar');
    if (nameEl) nameEl.textContent = u.users_name || 'ผู้ใช้งาน';
    if (avatarEl) avatarEl.textContent = (u.users_name || 'U').charAt(0);
  },

  showAccessDeniedScreen: function(msg) {
    var container = document.getElementById('mainContentArea');
    if (container) {
      container.innerHTML = 
        '<div class="card" style="text-align:center; padding: 40px 20px; margin-top: 30px;">' +
          '<div style="font-size: 3rem; margin-bottom: 12px;">🚫</div>' +
          '<h2 style="color: #EF4444; margin-bottom: 10px;">การเข้าถึงถูกปฏิเสธ</h2>' +
          '<p style="color: #64748B; font-size: 0.95rem; margin-bottom: 20px;">' + (msg || 'ท่านไม่มีสิทธิ์เข้าใช้งานระบบ SA03') + '</p>' +
          '<button class="btn btn-secondary" onclick="location.reload()" style="max-width: 200px; margin: 0 auto;">ลองใหม่อีกครั้ง</button>' +
        '</div>';
    }
  },

  /**
   * Hybrid RPC Wrapper:
   * 1. ถ้ารันใน Apps Script -> เรียก google.script.run
   * 2. ถ้ารันบน GitHub Pages / ภายนอก -> เรียก fetch() ไปยัง gasUrl ผ่าน POST
   */
  callServer: function(fnName) {
    var self = this;
    var args = Array.prototype.slice.call(arguments, 1);

    // ตรวจสอบว่ามี google.script.run พร้อมใช้งานหรือไม่
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      return new Promise(function(resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);

        if (typeof runner[fnName] === 'function') {
          runner[fnName].apply(runner, args);
        } else {
          reject(new Error('ไม่พบฟังก์ชัน ' + fnName + ' บน Server'));
        }
      });
    } else {
      // โหมดรันจาก GitHub Pages
      return self.callGasApi_(fnName, args);
    }
  },

  /**
   * ส่ง HTTP POST ไปยัง Google Apps Script Web App (สำหรับ GitHub Pages)
   */
  callGasApi_: function(fnName, args) {
    var self = this;
    var action = fnName.replace(/^api/, '');
    action = action.charAt(0).toLowerCase() + action.slice(1);

    var body = { action: action };

    if (action === 'verifyUser') {
      body.lineUid = args[0];
    } else if (action === 'getChecklistForm') {
      body.lineUid = args[0];
      body.transDate = args[1];
    } else if (action === 'getApprovalQueue') {
      body.lineUid = args[0];
      body.monthFilter = args[1];
    } else if (action === 'saveChecklist' || action === 'resubmitChecklist' || action === 'approveAction' || action === 'rejectAction') {
      var payload = args[0] || {};
      for (var k in payload) {
        body[k] = payload[k];
      }
    }

    return fetch(self.gasUrl, {
      method: 'POST',
      headers: {
        // สำคัญ: ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง OPTIONS preflight (GAS ไม่รองรับ OPTIONS)
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(body)
    })
    .then(function(res) {
      return res.json();
    })
    .catch(function(err) {
      console.error('[App] GAS API Call Error:', err);
      throw new Error('ไม่สามารถติดต่อ Google Apps Script Server ได้: ' + err.message);
    });
  },

  showLoading: function(text) {
    var overlay = document.getElementById('loadingOverlay');
    var textEl = document.getElementById('loadingText');
    if (textEl) textEl.textContent = text || 'กำลังประมวลผล...';
    if (overlay) overlay.classList.add('active');
  },

  hideLoading: function() {
    var overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.classList.remove('active');
  },

  showToast: function(message, type) {
    var container = document.getElementById('toastContainer');
    if (!container) return;

    var toast = document.createElement('div');
    toast.className = 'toast ' + (type || 'info');
    
    var icon = 'ℹ️';
    if (type === 'success') icon = '✅';
    if (type === 'error') icon = '❌';
    if (type === 'warning') icon = '⚠️';

    toast.innerHTML = '<span>' + icon + '</span><span>' + message + '</span>';
    container.appendChild(toast);

    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s';
      setTimeout(function() {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 300);
    }, 4000);
  }
};
</script>
